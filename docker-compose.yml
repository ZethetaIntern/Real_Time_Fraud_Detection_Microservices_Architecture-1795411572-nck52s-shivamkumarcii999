version: "3.8"

services:
  # ==========================================
  # Edge Gateway & Rate Limiting
  # ==========================================
  api-gateway:
    image: kong:3.6
    container_name: shieldpay-api-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8443:8443"
    networks:
      - fraud-mesh

  # ==========================================
  # Core Streaming Backbone (Kafka + Zookeeper)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shieldpay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud-mesh

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shieldpay-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - fraud-mesh

  # ==========================================
  # Polyglot In-Memory & Graph Datastores
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: shieldpay-redis-velocity
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - fraud-mesh

  neo4j:
    image: neo4j:5.15-community
    container_name: shieldpay-neo4j-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/ShieldPay#Graph2026"
    networks:
      - fraud-mesh

  # ==========================================
  # Microservices Application Core
  # ==========================================
  fraud-detection-app:
    build:
      context: .
      dockerfile: samples/Dockerfile.transaction-ingestion
    container_name: shieldpay-fraud-core
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      - kafka
      - redis
      - neo4j
    networks:
      - fraud-mesh

networks:
  fraud-mesh:
    driver: bridge
