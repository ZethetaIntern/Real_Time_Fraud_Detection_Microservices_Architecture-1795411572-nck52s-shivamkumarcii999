apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-engine-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: rule-engine-service
    app.kubernetes.io/part-of: detection-engine
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: rule-engine-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rule-engine-service
        app.kubernetes.io/part-of: detection-engine
    spec:
      serviceAccountName: rule-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: service
          image: shieldpay/rule-engine-service:2.4.0
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "6000m"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rule-engine-service
  namespace: fraud-detection
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: rule-engine-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rule-engine-pdb
  namespace: fraud-detection
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: rule-engine-service
