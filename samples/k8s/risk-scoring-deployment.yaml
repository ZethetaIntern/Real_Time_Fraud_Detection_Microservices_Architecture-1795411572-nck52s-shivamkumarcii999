apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-scoring-service
  namespace: fraud-detection
  labels:
    app.kubernetes.io/name: risk-scoring-service
    app.kubernetes.io/part-of: core-risk
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-scoring-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-scoring-service
    spec:
      serviceAccountName: risk-scoring-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: service
          image: shieldpay/risk-scoring-service:2.4.0
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "2Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: risk-scoring-service
  namespace: fraud-detection
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: risk-scoring-service
