groups:
  - name: shieldpay-fraud-recording
    rules:
      - record: transaction:throughput:rate1m
        expr: sum(rate(http_requests_total{job="transaction-ingestion"}[1m]))

      - record: fraud:detection_rate:1h
        expr: sum(rate(fraud_detected_total[1h])) / sum(rate(fraud_ground_truth_total[1h]))

      - record: fraud:false_positive_rate:1h
        expr: sum(rate(false_positives_total[1h])) / sum(rate(legitimate_transactions_total[1h]))

      - record: transaction:latency:p99_5m
        expr: histogram_quantile(0.99, sum(rate(transaction_duration_seconds_bucket[5m])) by (le))
