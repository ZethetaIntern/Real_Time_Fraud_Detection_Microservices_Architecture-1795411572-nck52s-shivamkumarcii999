apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: anomaly-detection-destination
  namespace: fraud-detection
spec:
  host: anomaly-detection-service.fraud-detection.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http2MaxRequests: 10000
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1-champion
      labels:
        version: v1.4.0
    - name: v2-challenger
      labels:
        version: v2.0.0-rc1
